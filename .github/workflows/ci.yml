name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca864246e89626a1102292303b # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run security:scan
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teamtrail_test
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-32chars
          BETTER_AUTH_URL: http://localhost:3000
