services:
  postgres:
    image: postgres:16-alpine
    container_name: teamtrail-postgres
    environment:
      POSTGRES_USER: teamtrail
      POSTGRES_PASSWORD: teamtrail_dev
      POSTGRES_DB: teamtrail_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtrail -d teamtrail_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: teamtrail-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    container_name: teamtrail-worker
    command: ["npm", "run", "worker"]
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
